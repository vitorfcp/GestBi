<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title th:text="${aula.id != null ? 'Editar Aula' : 'Nova Aula'}">Aula</title>
</head>
<body>
<div layout:fragment="content">
    <div class="page-header">
        <h2>
            <i class="bi bi-calendar-plus me-2" th:if="${aula.id == null}"></i>
            <i class="bi bi-pencil-square me-2" th:if="${aula.id != null}"></i>
            <span th:text="${aula.id != null ? 'Editar Aula' : 'Nova Aula'}"></span>
        </h2>
    </div>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/aulas/guardar}" th:object="${aula}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="row g-3">
                    <div class="col-md-8">
                        <label class="form-label fw-semibold">Tema *</label>
                        <input type="text" class="form-control" th:field="*{tema}"
                               th:classappend="${#fields.hasErrors('tema')} ? 'is-invalid' : ''">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('tema')}" th:errors="*{tema}"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Estado</label>
                        <select class="form-select" th:field="*{estado}">
                            <option th:each="e : ${estados}" th:value="${e}" th:text="${e}"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Turma *</label>
                        <select class="form-select" th:field="*{turma}"
                                th:classappend="${#fields.hasErrors('turma')} ? 'is-invalid' : ''">
                            <option value="">-- Selecionar turma --</option>
                            <option th:each="t : ${turmas}" th:value="${t.id}" th:text="${t.nome}"></option>
                        </select>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('turma')}" th:errors="*{turma}"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Professor</label>
                        <input type="text" class="form-control" th:field="*{professor}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Sala</label>
                        <input type="text" class="form-control" th:field="*{sala}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Data/Hora Início *</label>
                        <input type="datetime-local" class="form-control" th:field="*{dataHoraInicio}"
                               th:classappend="${#fields.hasErrors('dataHoraInicio')} ? 'is-invalid' : ''">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('dataHoraInicio')}" th:errors="*{dataHoraInicio}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Data/Hora Fim *</label>
                        <input type="datetime-local" class="form-control" th:field="*{dataHoraFim}"
                               th:classappend="${#fields.hasErrors('dataHoraFim')} ? 'is-invalid' : ''">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('dataHoraFim')}" th:errors="*{dataHoraFim}"></div>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold">Descrição</label>
                        <textarea class="form-control" th:field="*{descricao}" rows="2"></textarea>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Conteúdo Programático</label>
                        <textarea class="form-control" th:field="*{conteudoProgramatico}" rows="3"></textarea>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Objetivos</label>
                        <textarea class="form-control" th:field="*{objetivos}" rows="3"></textarea>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold">Recursos Necessários</label>
                        <textarea class="form-control" th:field="*{recursos}" rows="2"></textarea>
                    </div>
                </div>

                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-warning">
                        <i class="bi bi-check-lg me-1"></i>Guardar
                    </button>
                    <a th:href="@{/aulas}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i>Voltar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
