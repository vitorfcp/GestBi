<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title th:text="${turma.id != null ? 'Editar Turma' : 'Nova Turma'}">Turma</title>
</head>
<body>
<div layout:fragment="content">
    <div class="page-header">
        <h2>
            <i class="bi bi-plus-circle me-2" th:if="${turma.id == null}"></i>
            <i class="bi bi-pencil-square me-2" th:if="${turma.id != null}"></i>
            <span th:text="${turma.id != null ? 'Editar Turma' : 'Nova Turma'}"></span>
        </h2>
    </div>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/turmas/guardar}" th:object="${turma}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Nome da Turma *</label>
                        <input type="text" class="form-control" th:field="*{nome}"
                               th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid' : ''">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Estado</label>
                        <select class="form-select" th:field="*{estado}">
                            <option th:each="e : ${estados}" th:value="${e}" th:text="${e}"></option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Max. Alunos *</label>
                        <input type="number" class="form-control" th:field="*{maxAlunos}" min="1" max="100"
                               th:classappend="${#fields.hasErrors('maxAlunos')} ? 'is-invalid' : ''">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('maxAlunos')}" th:errors="*{maxAlunos}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Disciplina</label>
                        <select class="form-select" th:field="*{disciplina}">
                            <option value="">-- Selecionar disciplina --</option>
                            <option th:each="d : ${disciplinas}" th:value="${d.id}" th:text="${d.nome}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Sala</label>
                        <input type="text" class="form-control" th:field="*{sala}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Data de Início *</label>
                        <input type="date" class="form-control" th:field="*{dataInicio}"
                               th:classappend="${#fields.hasErrors('dataInicio')} ? 'is-invalid' : ''">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('dataInicio')}" th:errors="*{dataInicio}"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Data de Fim</label>
                        <input type="date" class="form-control" th:field="*{dataFim}">
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold">Descrição</label>
                        <textarea class="form-control" th:field="*{descricao}" rows="3"></textarea>
                    </div>
                </div>

                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-check-lg me-1"></i>Guardar
                    </button>
                    <a th:href="@{/turmas}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i>Voltar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
