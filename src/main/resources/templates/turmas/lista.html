<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title>Turmas</title>
</head>
<body>
<div layout:fragment="content">
    <div class="page-header d-flex justify-content-between align-items-center flex-wrap gap-2">
        <h2><i class="bi bi-collection me-2"></i>Turmas</h2>
        <a th:href="@{/turmas/nova}" class="btn btn-success">
            <i class="bi bi-plus-circle me-1"></i>Nova Turma
        </a>
    </div>

    <div th:if="${mensagem}" class="alert" th:classappend="'alert-' + ${tipoMensagem}" role="alert">
        <span th:text="${mensagem}"></span>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <form th:action="@{/turmas}" method="get" class="d-flex search-box">
                <input type="text" name="pesquisa" class="form-control me-2" placeholder="Pesquisar por nome..."
                       th:value="${pesquisa}">
                <button type="submit" class="btn btn-outline-success">
                    <i class="bi bi-search"></i>
                </button>
                <a th:href="@{/turmas}" class="btn btn-outline-secondary ms-2" th:if="${pesquisa}">
                    <i class="bi bi-x-lg"></i>
                </a>
            </form>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-4 col-sm-6" th:each="turma : ${turmas}">
            <div class="card h-100">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <h5 class="card-title mb-0">
                            <a th:href="@{/turmas/ver/{id}(id=${turma.id})}" class="text-decoration-none"
                               th:text="${turma.nome}"></a>
                        </h5>
                        <span class="badge badge-estado"
                              th:classappend="${turma.estado.name() == 'ABERTA' ? 'bg-success' :
                                               (turma.estado.name() == 'EM_CURSO' ? 'bg-primary' :
                                               (turma.estado.name() == 'FECHADA' ? 'bg-secondary' : 'bg-danger'))}"
                              th:text="${turma.estado}"></span>
                    </div>
                    <p class="card-text text-muted small" th:if="${turma.descricao}" th:text="${turma.descricao}"></p>
                    <div class="mb-2" th:if="${turma.disciplina}">
                        <i class="bi bi-book me-1 text-muted"></i>
                        <span th:text="${turma.disciplina.nome}" class="small"></span>
                    </div>
                    <div class="d-flex justify-content-between align-items-center small text-muted">
                        <div>
                            <i class="bi bi-calendar me-1"></i>
                            <span th:text="${turma.dataInicio != null ? #temporals.format(turma.dataInicio, 'dd/MM/yyyy') : '-'}"></span>
                        </div>
                        <div>
                            <i class="bi bi-people me-1"></i>
                            <span th:text="${turma.numeroAlunosInscritos}">0</span> /
                            <span th:text="${turma.maxAlunos}">0</span>
                        </div>
                    </div>
                    <div th:if="${turma.sala}" class="small text-muted mt-1">
                        <i class="bi bi-door-open me-1"></i>Sala: <span th:text="${turma.sala}"></span>
                    </div>
                </div>
                <div class="card-footer bg-transparent border-0 d-flex gap-1">
                    <a th:href="@{/turmas/ver/{id}(id=${turma.id})}" class="btn btn-sm btn-outline-info">
                        <i class="bi bi-eye me-1"></i>Ver
                    </a>
                    <a th:href="@{/turmas/editar/{id}(id=${turma.id})}" class="btn btn-sm btn-outline-warning">
                        <i class="bi bi-pencil me-1"></i>Editar
                    </a>
                    <a th:href="@{/turmas/eliminar/{id}(id=${turma.id})}" class="btn btn-sm btn-outline-danger"
                       onclick="return confirm('Tem a certeza que deseja eliminar esta turma?')">
                        <i class="bi bi-trash me-1"></i>Eliminar
                    </a>
                </div>
            </div>
        </div>
        <div class="col-12" th:if="${#lists.isEmpty(turmas)}">
            <div class="card">
                <div class="card-body text-center text-muted py-5">
                    <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                    Nenhuma turma encontrada
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
