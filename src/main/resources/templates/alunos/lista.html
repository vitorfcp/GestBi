<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title>Alunos</title>
</head>
<body>
<div layout:fragment="content">
    <div class="page-header d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div>
            <h2><i class="bi bi-people me-2"></i>Alunos</h2>
        </div>
        <a th:href="@{/alunos/novo}" class="btn btn-primary">
            <i class="bi bi-person-plus me-1"></i>Novo Aluno
        </a>
    </div>

    <div th:if="${mensagem}" class="alert" th:classappend="'alert-' + ${tipoMensagem}" role="alert">
        <span th:text="${mensagem}"></span>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <form th:action="@{/alunos}" method="get" class="d-flex search-box">
                <input type="text" name="pesquisa" class="form-control me-2" placeholder="Pesquisar por nome..."
                       th:value="${pesquisa}">
                <button type="submit" class="btn btn-outline-primary">
                    <i class="bi bi-search"></i>
                </button>
                <a th:href="@{/alunos}" class="btn btn-outline-secondary ms-2" th:if="${pesquisa}">
                    <i class="bi bi-x-lg"></i>
                </a>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Foto</th>
                            <th>N.º Aluno</th>
                            <th>Nome</th>
                            <th>Email</th>
                            <th>Telefone</th>
                            <th>Turma</th>
                            <th>Estado</th>
                            <th class="text-end">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="aluno : ${alunos}">
                            <td>
                                <img th:if="${aluno.fotoUrl}" th:src="${aluno.fotoUrl}" class="foto-aluno-sm" alt="Foto">
                                <div th:unless="${aluno.fotoUrl}" class="foto-placeholder-sm">
                                    <i class="bi bi-person"></i>
                                </div>
                            </td>
                            <td th:text="${aluno.numeroAluno}"></td>
                            <td>
                                <a th:href="@{/alunos/ver/{id}(id=${aluno.id})}" class="text-decoration-none fw-semibold"
                                   th:text="${aluno.nome}"></a>
                            </td>
                            <td th:text="${aluno.email}"></td>
                            <td th:text="${aluno.telefone}"></td>
                            <td>
                                <span th:if="${aluno.turma}" th:text="${aluno.turma.nome}" class="badge bg-info"></span>
                                <span th:unless="${aluno.turma}" class="badge bg-secondary">Sem turma</span>
                            </td>
                            <td>
                                <span class="badge badge-estado"
                                      th:classappend="${aluno.estado.name() == 'ATIVO' ? 'bg-success' :
                                                       (aluno.estado.name() == 'INATIVO' ? 'bg-secondary' :
                                                       (aluno.estado.name() == 'SUSPENSO' ? 'bg-warning' : 'bg-info'))}"
                                      th:text="${aluno.estado}"></span>
                            </td>
                            <td class="text-end">
                                <a th:href="@{/alunos/ver/{id}(id=${aluno.id})}" class="btn btn-sm btn-outline-info btn-action" title="Ver">
                                    <i class="bi bi-eye"></i>
                                </a>
                                <a th:href="@{/alunos/editar/{id}(id=${aluno.id})}" class="btn btn-sm btn-outline-warning btn-action" title="Editar">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <a th:href="@{/alunos/eliminar/{id}(id=${aluno.id})}" class="btn btn-sm btn-outline-danger btn-action"
                                   title="Eliminar" onclick="return confirm('Tem a certeza que deseja eliminar este aluno?')">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(alunos)}">
                            <td colspan="8" class="text-center text-muted py-4">
                                <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                                Nenhum aluno encontrado
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
