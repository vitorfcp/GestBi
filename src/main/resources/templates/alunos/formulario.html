<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title th:text="${aluno.id != null ? 'Editar Aluno' : 'Novo Aluno'}">Aluno</title>
</head>
<body>
<div layout:fragment="content">
    <div class="page-header">
        <h2>
            <i class="bi bi-person-plus me-2" th:if="${aluno.id == null}"></i>
            <i class="bi bi-pencil-square me-2" th:if="${aluno.id != null}"></i>
            <span th:text="${aluno.id != null ? 'Editar Aluno' : 'Novo Aluno'}"></span>
        </h2>
    </div>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/alunos/guardar}" th:object="${aluno}" method="post" enctype="multipart/form-data">
                <input type="hidden" th:field="*{id}">
                <input type="hidden" th:field="*{fotoUrl}">
                <input type="hidden" th:field="*{numeroAluno}">

                <div class="row">
                    <div class="col-md-3 text-center mb-4">
                        <div class="mb-3">
                            <img th:if="${aluno.fotoUrl}" th:src="${aluno.fotoUrl}" class="foto-aluno mb-2" alt="Foto" id="previewFoto">
                            <div th:unless="${aluno.fotoUrl}" class="foto-placeholder mb-2 mx-auto" id="placeholderFoto">
                                <i class="bi bi-person"></i>
                            </div>
                            <img id="previewFotoNew" class="foto-aluno mb-2 d-none" alt="Preview">
                        </div>
                        <label class="btn btn-outline-primary btn-sm">
                            <i class="bi bi-camera me-1"></i>Escolher Foto
                            <input type="file" name="foto" accept="image/*" class="d-none" id="inputFoto"
                                   onchange="previewImage(this)">
                        </label>
                    </div>

                    <div class="col-md-9">
                        <div class="row g-3">
                            <div class="col-md-8">
                                <label class="form-label fw-semibold">Nome *</label>
                                <input type="text" class="form-control" th:field="*{nome}"
                                       th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Estado</label>
                                <select class="form-select" th:field="*{estado}">
                                    <option th:each="e : ${estados}" th:value="${e}" th:text="${e}"></option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Email *</label>
                                <input type="email" class="form-control" th:field="*{email}"
                                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-semibold">Data Nascimento *</label>
                                <input type="date" class="form-control" th:field="*{dataNascimento}"
                                       th:classappend="${#fields.hasErrors('dataNascimento')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('dataNascimento')}" th:errors="*{dataNascimento}"></div>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-semibold">Telefone</label>
                                <input type="text" class="form-control" th:field="*{telefone}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Morada</label>
                                <input type="text" class="form-control" th:field="*{morada}">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-semibold">Código Postal</label>
                                <input type="text" class="form-control" th:field="*{codigoPostal}">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-semibold">Cidade</label>
                                <input type="text" class="form-control" th:field="*{cidade}">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Nacionalidade</label>
                                <input type="text" class="form-control" th:field="*{nacionalidade}">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Doc. Identificação</label>
                                <input type="text" class="form-control" th:field="*{documentoIdentificacao}">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Turma</label>
                                <select class="form-select" th:field="*{turma}">
                                    <option value="">-- Sem turma --</option>
                                    <option th:each="t : ${turmas}" th:value="${t.id}" th:text="${t.nome}"></option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-semibold">Observações</label>
                                <textarea class="form-control" th:field="*{observacoes}" rows="3"></textarea>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-1"></i>Guardar
                    </button>
                    <a th:href="@{/alunos}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i>Voltar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<script th:inline="javascript">
function previewImage(input) {
    if (input.files && input.files[0]) {
        var reader = new FileReader();
        reader.onload = function(e) {
            var preview = document.getElementById('previewFotoNew');
            var existing = document.getElementById('previewFoto');
            var placeholder = document.getElementById('placeholderFoto');
            preview.src = e.target.result;
            preview.classList.remove('d-none');
            if (existing) existing.classList.add('d-none');
            if (placeholder) placeholder.classList.add('d-none');
        }
        reader.readAsDataURL(input.files[0]);
    }
}
</script>
</body>
</html>
