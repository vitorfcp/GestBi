<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title>Ficha do Aluno</title>
</head>
<body>
<div layout:fragment="content">
    <div class="page-header d-flex justify-content-between align-items-center flex-wrap gap-2">
        <h2><i class="bi bi-person-vcard me-2"></i>Ficha do Aluno</h2>
        <div class="d-flex gap-2">
            <a th:href="@{/alunos/editar/{id}(id=${aluno.id})}" class="btn btn-warning">
                <i class="bi bi-pencil me-1"></i>Editar
            </a>
            <a th:href="@{/alunos}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i>Voltar
            </a>
        </div>
    </div>

    <div class="card ficha-aluno">
        <div class="card-body">
            <div class="row">
                <div class="col-md-3 text-center mb-4">
                    <img th:if="${aluno.fotoUrl}" th:src="${aluno.fotoUrl}" class="foto-aluno mb-3" alt="Foto do Aluno">
                    <div th:unless="${aluno.fotoUrl}" class="foto-placeholder mb-3 mx-auto">
                        <i class="bi bi-person"></i>
                    </div>
                    <h5 th:text="${aluno.nome}" class="fw-bold"></h5>
                    <span class="badge badge-estado"
                          th:classappend="${aluno.estado.name() == 'ATIVO' ? 'bg-success' :
                                           (aluno.estado.name() == 'INATIVO' ? 'bg-secondary' :
                                           (aluno.estado.name() == 'SUSPENSO' ? 'bg-warning' : 'bg-info'))}"
                          th:text="${aluno.estado}"></span>
                    <div class="mt-2">
                        <small class="text-muted">N.º Aluno: </small>
                        <span class="fw-semibold" th:text="${aluno.numeroAluno}"></span>
                    </div>
                </div>

                <div class="col-md-9">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <div class="info-label">Email</div>
                            <div class="info-value" th:text="${aluno.email ?: '-'}"></div>
                        </div>
                        <div class="col-md-3">
                            <div class="info-label">Data de Nascimento</div>
                            <div class="info-value" th:text="${aluno.dataNascimento != null ? #temporals.format(aluno.dataNascimento, 'dd/MM/yyyy') : '-'}"></div>
                        </div>
                        <div class="col-md-3">
                            <div class="info-label">Telefone</div>
                            <div class="info-value" th:text="${aluno.telefone ?: '-'}"></div>
                        </div>
                        <div class="col-12"><hr></div>
                        <div class="col-md-6">
                            <div class="info-label">Morada</div>
                            <div class="info-value" th:text="${aluno.morada ?: '-'}"></div>
                        </div>
                        <div class="col-md-3">
                            <div class="info-label">Código Postal</div>
                            <div class="info-value" th:text="${aluno.codigoPostal ?: '-'}"></div>
                        </div>
                        <div class="col-md-3">
                            <div class="info-label">Cidade</div>
                            <div class="info-value" th:text="${aluno.cidade ?: '-'}"></div>
                        </div>
                        <div class="col-12"><hr></div>
                        <div class="col-md-4">
                            <div class="info-label">Nacionalidade</div>
                            <div class="info-value" th:text="${aluno.nacionalidade ?: '-'}"></div>
                        </div>
                        <div class="col-md-4">
                            <div class="info-label">Doc. Identificação</div>
                            <div class="info-value" th:text="${aluno.documentoIdentificacao ?: '-'}"></div>
                        </div>
                        <div class="col-md-4">
                            <div class="info-label">Turma</div>
                            <div class="info-value">
                                <a th:if="${aluno.turma}" th:href="@{/turmas/ver/{id}(id=${aluno.turma.id})}"
                                   th:text="${aluno.turma.nome}" class="badge bg-info text-decoration-none"></a>
                                <span th:unless="${aluno.turma}" class="badge bg-secondary">Sem turma</span>
                            </div>
                        </div>
                        <div class="col-12" th:if="${aluno.observacoes}">
                            <hr>
                            <div class="info-label">Observações</div>
                            <div class="info-value" th:text="${aluno.observacoes}"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
