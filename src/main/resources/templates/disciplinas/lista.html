<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title>Disciplinas</title>
</head>
<body>
<div layout:fragment="content">
    <div class="page-header d-flex justify-content-between align-items-center flex-wrap gap-2">
        <h2><i class="bi bi-book me-2"></i>Disciplinas</h2>
        <a th:href="@{/disciplinas/nova}" class="btn btn-danger">
            <i class="bi bi-journal-plus me-1"></i>Nova Disciplina
        </a>
    </div>

    <div th:if="${mensagem}" class="alert" th:classappend="'alert-' + ${tipoMensagem}" role="alert">
        <span th:text="${mensagem}"></span>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Código</th>
                            <th>Nome</th>
                            <th>Professor</th>
                            <th>Carga Horária</th>
                            <th>Descrição</th>
                            <th class="text-end">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="disciplina : ${disciplinas}">
                            <td><span class="badge bg-dark" th:text="${disciplina.codigo ?: '-'}"></span></td>
                            <td class="fw-semibold" th:text="${disciplina.nome}"></td>
                            <td th:text="${disciplina.professor ?: '-'}"></td>
                            <td>
                                <span th:if="${disciplina.cargaHoraria}" th:text="${disciplina.cargaHoraria + 'h'}"></span>
                                <span th:unless="${disciplina.cargaHoraria}">-</span>
                            </td>
                            <td class="text-muted small" th:text="${disciplina.descricao ?: '-'}"></td>
                            <td class="text-end">
                                <a th:href="@{/disciplinas/editar/{id}(id=${disciplina.id})}" class="btn btn-sm btn-outline-warning btn-action" title="Editar">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <a th:href="@{/disciplinas/eliminar/{id}(id=${disciplina.id})}" class="btn btn-sm btn-outline-danger btn-action"
                                   title="Eliminar" onclick="return confirm('Tem a certeza que deseja eliminar esta disciplina?')">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(disciplinas)}">
                            <td colspan="6" class="text-center text-muted py-4">
                                <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                                Nenhuma disciplina encontrada
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
